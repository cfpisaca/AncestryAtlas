         `position: fixed` element is pinned to, and why it could otherwise end
         up positioned above the area that's actually still visible. Without
         this, fixed UI has to fight the keyboard with JS (see
         useVisibleViewportHeight.ts), which is unreliable across reflow/
         rotation edge cases; with it, the browser keeps the layout in sync
         with the keyboard natively. -->
